<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de producto</title>
    <link rel="stylesheet" href="stile.css">
</head>
<body>

<div class="tarjeta"> 
    <h1>Catálogo de producto</h1>

    <div class="catalogo">
        <div class="producto">
            <img src="teclado.jpg" alt="teclado">
            <h3>teclado</h3>
            <p>$500</p>
            <button>comprar</button>
        </div>

        <div class="producto">
            <img src="mouse.jpg" alt="mouse">
            <h3>mouse</h3>
            <p>$350</p>
            <button>comprar</button>
        </div>

        <div class="producto">
            <img src="monitor.jpg" alt="monitor">
            <h3>monitor</h3>
            <p>$15,000</p>
            <button>comprar</button>
        </div>

        <div class="producto">
            <img src="audifonos.jpg" alt="audífonos">
            <h3>audífonos</h3>
            <p>$500</p>
            <button>comprar</button>
        </div>
    </div>
    <center>
    <p>Eliam Rubio #19</p>
  </center>
</div>
</body>
</html>
